name: Validate and build iOS IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Validate authored course
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate authored content and curriculum coverage
        run: |
          python3 scripts/compile_grammar.py content/authoring/n5-structures.tsv content/batches/002-n5-structures.json --check
          python3 scripts/compile_readings.py content/authoring/n5-readings.tsv content/batches/003-n5-readings.json --check
          python3 scripts/compile_words.py content/authoring/n5-reading-words.tsv content/batches/004-n5-reading-vocabulary.json --check
          python3 scripts/build_content.py --check
          python3 scripts/audit_curriculum.py --output curriculum-audit.json
          python3 -m unittest discover -s Tests/ContentTests -v
      - name: Upload actual curriculum coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-coverage
          path: curriculum-audit.json
          if-no-files-found: ignore

  ios:
    name: Test and package iOS 15.5+
    needs: content
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      app_version: ${{ steps.package.outputs.app_version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Confirm toolchain
        run: xcodebuild -version
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl --fail --location --retry 3 "$XCODEGEN_URL" --output "$RUNNER_TEMP/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen"
          generator=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen | head -n 1)
          test -n "$generator"
          "$generator" generate --spec project.yml
      - name: Test learning core
        run: swift test --parallel
      - name: Select iPhone SE3 simulator
        run: |
          simulator_id=$(python3 scripts/select_simulator.py)
          printf 'SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
      - name: Test persistence, timing and SE3 layouts
        run: |
          xcodebuild test -project JPLearn.xcodeproj -scheme JPLearn -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build device archive
        run: |
          xcodebuild archive -project JPLearn.xcodeproj -scheme JPLearn -configuration Release -destination 'generic/platform=iOS' -archivePath build/JPLearn.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
      - name: Package TrollStore IPA
        id: package
        run: |
          python3 scripts/check_archive.py build/JPLearn.xcarchive/Products/Applications/JPLearn.app
          app_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/JPLearn.xcarchive/Products/Applications/JPLearn.app/Info.plist)
          printf 'app_version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"
          mkdir -p build/ipa/Payload
          cp -R build/JPLearn.xcarchive/Products/Applications/JPLearn.app build/ipa/Payload/
          cd build/ipa
          ditto -c -k --keepParent Payload ../JPLearn.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JPLearn-${{ github.sha }}
          path: build/JPLearn.ipa
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
      - name: Export SE3 screenshots
        if: always()
        run: |
          if test -d build/TestResults.xcresult; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/screenshots || true
          fi
      - name: Upload SE3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SE3-screenshots
          path: build/screenshots
          if-no-files-found: ignore

  release:
    name: Publish versioned IPA
    needs: ios
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JPLearn-${{ github.sha }}
          path: build/release
      - name: Publish release without replacing existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.ios.outputs.app_version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: bash scripts/publish_release.sh
